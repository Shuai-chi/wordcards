# Module 5 選讀範例:用 CloudFormation(Infrastructure as Code)建立一台 EC2
# 部署: aws cloudformation deploy --template-file cloudformation-minimal.yaml --stack-name course-demo --parameter-overrides KeyName=my-key
AWSTemplateFormatVersion: "2010-09-09"
Description: Module 5 minimal EC2 for course demo

Parameters:
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: 已存在的 EC2 金鑰對名稱

Resources:
  DemoSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow SSH and API port
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          CidrIp: 0.0.0.0/0

  DemoInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t2.micro
      KeyName: !Ref KeyName
      ImageId: ami-0c02fb55956c7d316  # Amazon Linux 2 (us-east-1,依區域調整)
      SecurityGroups:
        - !Ref DemoSecurityGroup

Outputs:
  PublicIP:
    Value: !GetAtt DemoInstance.PublicIp
