services:
  chat-service:
    build: ./chat-service
    ports:
      - "8001:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}

  linebot-service:
    build: ./linebot-service
    ports:
      - "8002:8000"
    environment:
      - CHAT_SERVICE_URL=http://chat-service:8000
    depends_on:
      - chat-service

  db:
    image: postgres:16
    environment:
      - POSTGRES_PASSWORD=devpassword
      - POSTGRES_DB=course_db
    ports:
      - "5432:5432"
    volumes:
      - course_db_data:/var/lib/postgresql/data

volumes:
  course_db_data:
